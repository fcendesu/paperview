[workspace]
members = [
    "crates/paperview-core",
    "crates/paperview-gui",
    "crates/paperview-tui",
]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/fcendesu/paperview"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = "deny"
